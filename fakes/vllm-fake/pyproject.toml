[project]
name = "vllm-fake"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Richiesto da starlette.testclient (FastAPI TestClient) per i test
    # HTTP diretti di SPEC-017 §7 — dipendenza diretta, non "extra": stesso
    # motivo di jsonschema in libs/py/pyproject.toml (nessuna
    # installazione di extra nel workflow di questa sessione).
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vllm_fake*"]

[tool.ruff]
extend-exclude = [".venv"]
