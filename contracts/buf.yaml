  # in questo task): escluse le 3 regole di naming convention che il contratto
  # già esistente non rispetta (nessun impatto su correttezza/breaking-change).
  except:
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
