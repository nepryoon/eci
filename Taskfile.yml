version: '3'

tasks:
  up:
    desc: Avvia lo stack di sviluppo locale (docker compose) e attende che tutti i servizi siano healthy
    cmds:
      - bash deploy/compose/up.sh

  down:
    desc: Ferma lo stack di sviluppo locale (docker compose); i volumi nominati non vengono rimossi
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml down

  up:verify:
    desc: Verifica connettività reale ai 5 datastore dello stack già in esecuzione
    cmds:
      - bash deploy/compose/verify.sh

  build:
    desc: Compila ogni modulo Go/Rust/Python di produzione tracciato
    cmds:
      - bash scripts/task-build.sh

  lint:
    desc: go vet / cargo clippy -D warnings / ruff su ogni modulo tracciato
    cmds:
      - bash scripts/task-lint.sh

  test:
    desc: Test CPU/unitari di ogni modulo e dei gate repository; non richiede Docker
    cmds:
      - bash scripts/task-test.sh

  test:integration:
    desc: Tutti i test di integrazione Docker-backed, inclusi tool e runtime
    cmds:
      - bash scripts/task-integration.sh

  test:e2e:
    desc: Pipeline end-to-end reale su fixture e golden dataset (richiede Docker)
    cmds:
      - bash scripts/task-e2e.sh

  test:interop:
    desc: Interoperabilità Go/Python di SecurityContext e trace context
    deps: [build]
    cmds:
      - bash scripts/task-interop.sh

  test:fakes:
    desc: Suite esplicita dei fake deterministici
    cmds:
      - bash scripts/task-fakes.sh

  test:security:
    desc: Suite avversariale security CPU; le prove datastore sono in test:integration
    deps: [build]
    cmds:
      - bash scripts/task-security.sh

  proto:gen:
    desc: Codegen Go (buf generate) + Python (grpc_tools.protoc) da retrieval.proto
    cmds:
      - bash scripts/task-proto-gen.sh

  proto:lint:
    desc: buf lint sui contratti proto (retrieval.proto)
    dir: contracts
    cmds:
      - buf lint

  proto:breaking:
    desc: Buf breaking-change check sui contratti proto contro origin/main
    dir: contracts
    cmds:
      # In CI su evento pull_request, actions/checkout non crea un branch
      # locale 'main' (solo origin/main come remote-tracking ref); buf
      # breaking --against '.git#branch=main' richiede un branch locale
      # risolvibile con quel nome esatto e fallisce con "fatal: couldn't
      # find remote ref main" (bug noto di buf, bufbuild/buf#376). Crea il
      # branch locale solo se manca — no-op in locale, dove main esiste già.
      - |
        if ! git show-ref --verify --quiet refs/heads/main; then
          git fetch origin main:main
        fi
      - buf breaking --against '../.git#branch=main,subdir=contracts'

  envoy:descriptor:
    desc: Rigenera deterministicamente il descriptor Envoy dal contratto retrieval
    cmds:
      - buf build contracts --as-file-descriptor-set -o deploy/envoy/retrieval.pb

  envoy:validate:
    desc: Valida il bootstrap TLS con l'immagine Envoy T6.6 pinned (richiede Docker e OpenSSL)
    cmds:
      - |
        # Docker Desktop only bind-mounts configured host shares. Keep the
        # ephemeral identity below the already shared repository root rather
        # than the host /tmp directory; the trap still removes it on every exit.
        ECI_ENVOY_TLS_DIR="$(mktemp -d -p '{{.ROOT_DIR}}' .tmp-envoy-validate.XXXXXX)"
        trap 'rm -rf -- "${ECI_ENVOY_TLS_DIR}"' EXIT
        openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
          -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
          -keyout "${ECI_ENVOY_TLS_DIR}/tls.key" -out "${ECI_ENVOY_TLS_DIR}/tls.crt" \
          >/dev/null 2>&1
        # This identity exists only for config validation. Make the bind-mounted
        # files readable by the image's non-root Envoy UID; the trap removes them.
        chmod 0755 "${ECI_ENVOY_TLS_DIR}"
        chmod 0644 "${ECI_ENVOY_TLS_DIR}/tls.key" "${ECI_ENVOY_TLS_DIR}/tls.crt"
        docker run --rm \
          -v "{{.ROOT_DIR}}/deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro" \
          -v "{{.ROOT_DIR}}/deploy/envoy/retrieval.pb:/etc/envoy/retrieval.pb:ro" \
          -v "${ECI_ENVOY_TLS_DIR}:/etc/envoy/tls:ro" \
          envoyproxy/envoy:v1.39.0@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66 \
          --mode validate --config-path /etc/envoy/envoy.yaml

  test:envoy:
    desc: Test CPU-only dell'edge con binario Envoy estratto dall'immagine pinned (richiede Docker)
    dir: services/api-gateway
    cmds:
      - |
        ECI_ENVOY_BIN_DIR="$(mktemp -d)"
        ECI_ENVOY_CONTAINER_ID=""
        cleanup_envoy_test() {
          if [ -n "${ECI_ENVOY_CONTAINER_ID}" ]; then
            docker rm -f "${ECI_ENVOY_CONTAINER_ID}" >/dev/null 2>&1 || true
          fi
          rm -rf -- "${ECI_ENVOY_BIN_DIR}"
        }
        trap cleanup_envoy_test EXIT
        ECI_ENVOY_CONTAINER_ID="$(docker create envoyproxy/envoy:v1.39.0@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66)"
        docker cp "${ECI_ENVOY_CONTAINER_ID}:/usr/local/bin/envoy" "${ECI_ENVOY_BIN_DIR}/envoy"
        docker rm "${ECI_ENVOY_CONTAINER_ID}" >/dev/null
        ECI_ENVOY_CONTAINER_ID=""
        chmod 0755 "${ECI_ENVOY_BIN_DIR}/envoy"
        ECI_ENVOY_BINARY="${ECI_ENVOY_BIN_DIR}/envoy" \
          go test -tags=integration ./internal/edge -run TestEnvoyGatewayEndToEnd -v

  schema:gen:
    desc: Codegen Pydantic/Go dai JSON Schema via datamodel-code-generator
    cmds:
      - bash scripts/task-schema-gen.sh

  verify:generated:
    desc: Rigenera proto, schema ed Envoy e richiede output tracciati invariati
    cmds:
      - task proto:gen
      - git diff --exit-code -- libs/go/eci/retrieval libs/py/eci_core/retrieval
      - task schema:gen
      - git diff --exit-code -- libs/py/eci_core/models.py libs/py/eci_core/outbox.py
      - task envoy:descriptor
      - git diff --exit-code -- deploy/envoy/retrieval.pb

  verify:ci:
    desc: Superficie CPU completa equivalente ai gate CI non-Docker
    cmds:
      - task build
      - task lint
      - task test
      - task test:fakes
      - task test:interop
      - task test:security
      - task guard
      - task proto:lint
      - task proto:breaking
      - task verify:generated
      - task k8s:validate

  db:migrate:
    desc: Applica le migration Postgres
    cmds:
      - migrate -source file://contracts/sql/migrations -database "${POSTGRES_DSN:-postgres://eci:eci-dev-only@localhost:5432/eci?sslmode=disable}" up

  db:migrate:down:
    desc: Rollback dell'ultima migration Postgres
    cmds:
      - migrate -source file://contracts/sql/migrations -database "${POSTGRES_DSN:-postgres://eci:eci-dev-only@localhost:5432/eci?sslmode=disable}" down 1

  db:migrate:new:
    desc: 'Crea una nuova coppia di file di migration vuota (uso: task db:migrate:new NAME=slug)'
    cmds:
      - migrate create -ext sql -dir contracts/sql/migrations -seq {{.NAME}}

  db:neo4j:migrate:
    desc: Applica le migration Cypher su Neo4j
    cmds:
      - cd tools/migrate-neo4j && go run . ../../contracts/cypher/schema.cypher

  guard:
    desc: Fallisce se contracts/ o l'ADD consolidato sono toccati senza un ADR nello stesso commit
    cmds:
      - bash scripts/guard.sh

  k8s:render:
    desc: Renderizza il chart ECI production-like senza accesso al cluster
    cmds:
      - helm template eci deploy/k8s/eci-platform --namespace query-plane

  k8s:validate:
    desc: Helm lint/render, policy, schemi kubeconform e test SPEC-062 CPU-only
    cmds:
      - bash scripts/k8s-validate.sh

  k8s:dev:up:
    desc: Crea/aggiorna il solo cluster kind eci-dev con operatori pinned
    cmds:
      - bash deploy/k8s/dev-up.sh

  k8s:dev:verify:
    desc: Verifica readiness e connettività reale nel cluster kind eci-dev
    cmds:
      - bash deploy/k8s/dev-verify.sh

  k8s:dev:down:
    desc: Elimina esclusivamente il cluster kind locale eci-dev
    cmds:
      - bash deploy/k8s/dev-down.sh
