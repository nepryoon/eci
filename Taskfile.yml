version: '3'

tasks:
  up:
    desc: Avvia lo stack di sviluppo locale (docker compose) e attende che tutti i servizi siano healthy
    cmds:
      - bash deploy/compose/up.sh

  down:
    desc: Ferma lo stack di sviluppo locale (docker compose); i volumi nominati non vengono rimossi
    cmds:
      - docker compose -f deploy/compose/docker-compose.yml down

  up:verify:
    desc: Verifica connettività reale ai 5 datastore dello stack già in esecuzione
    cmds:
      - bash deploy/compose/verify.sh

  build:
    desc: Compila ogni modulo Go/Rust/Python popolato in services/
    cmds:
      - bash scripts/task-build.sh

  lint:
    desc: go vet / cargo clippy / ruff check su ogni modulo popolato in services/
    cmds:
      - bash scripts/task-lint.sh
      - cd tools/migrate-neo4j && go vet ./...
      - cd tests/integration/postgres_ddl && go vet ./... && go vet -tags=integration ./...
      - cd tests/integration/outbox_cdc && go vet -tags=integration ./...
      - cd services/ingestion && cargo clippy --test persist_integration_test

  test:
    desc: go test / cargo test / pytest su ogni modulo, più i test di scripts/guard.sh
    cmds:
      - bash scripts/task-test.sh
      - cd tools/migrate-neo4j && go test ./...
      - cd tests/integration/postgres_ddl && go test ./...

  test:integration:
    desc: Test di integrazione con testcontainers (richiede docker)
    cmds:
      - cd tools/migrate-neo4j && go test -tags=integration ./...
      - cd tests/integration/postgres_ddl && go test -tags=integration ./...
      - cd tests/integration/outbox_cdc && go test -tags=integration ./...
      - cd services/ingestion && cargo test --test persist_integration_test -- --ignored --test-threads=1
      - cd services/ingestion && cargo test --test chunk_persist_integration_test -- --ignored --test-threads=1
      - cd services/sink-graph && go test -tags=integration ./internal/consumer -run TestSinkGraphConsumer -v
      - cd services/sink-vector && go test -tags=integration ./internal/consumer -run TestSinkVectorConsumer -v
      - cd services/sink-search && go test -tags=integration ./internal/consumer -run TestSinkSearchConsumer -v
      - cd services/retrieval-engine && go test -tags=integration ./internal/server -run TestRetrievalEngineServer -v
      - cd services/retrieval-engine && go test -tags=integration ./internal/hybridsearch -run 'TestHybridSearchIntegration|TestHybridGraphVectorSearchContentHydration' -v
      - cd services/semantic-cache && go test -tags=integration ./internal/server -run TestSemanticCacheServer -v
      - bash scripts/test-minio-worm.sh

  proto:gen:
    desc: Codegen Go (buf generate) + Python (grpc_tools.protoc) da retrieval.proto
    cmds:
      - bash scripts/task-proto-gen.sh

  proto:lint:
    desc: buf lint sui contratti proto (retrieval.proto)
    dir: contracts
    cmds:
      - buf lint

  proto:breaking:
    desc: Buf breaking-change check sui contratti proto contro origin/main
    dir: contracts
    cmds:
      # In CI su evento pull_request, actions/checkout non crea un branch
      # locale 'main' (solo origin/main come remote-tracking ref); buf
      # breaking --against '.git#branch=main' richiede un branch locale
      # risolvibile con quel nome esatto e fallisce con "fatal: couldn't
      # find remote ref main" (bug noto di buf, bufbuild/buf#376). Crea il
      # branch locale solo se manca — no-op in locale, dove main esiste già.
      - |
        if ! git show-ref --verify --quiet refs/heads/main; then
          git fetch origin main:main
        fi
      - buf breaking --against '../.git#branch=main,subdir=contracts'

  schema:gen:
    desc: Codegen Pydantic/Go dai JSON Schema via datamodel-code-generator
    cmds:
      - bash scripts/task-schema-gen.sh

  db:migrate:
    desc: Applica le migration Postgres
    cmds:
      - migrate -source file://contracts/sql/migrations -database "${POSTGRES_DSN:-postgres://eci:eci-dev-only@localhost:5432/eci?sslmode=disable}" up

  db:migrate:down:
    desc: Rollback dell'ultima migration Postgres
    cmds:
      - migrate -source file://contracts/sql/migrations -database "${POSTGRES_DSN:-postgres://eci:eci-dev-only@localhost:5432/eci?sslmode=disable}" down 1

  db:migrate:new:
    desc: 'Crea una nuova coppia di file di migration vuota (uso: task db:migrate:new NAME=slug)'
    cmds:
      - migrate create -ext sql -dir contracts/sql/migrations -seq {{.NAME}}

  db:neo4j:migrate:
    desc: Applica le migration Cypher su Neo4j
    cmds:
      - cd tools/migrate-neo4j && go run . ../../contracts/cypher/schema.cypher

  guard:
    desc: Fallisce se contracts/ o docs/add/ sono toccati senza un ADR nello stesso commit
    cmds:
      - bash scripts/guard.sh
