version: '3'

tasks:
  up:
    desc: Avvia lo stack di sviluppo locale (docker compose)
    cmds:
      - echo "not implemented yet — see T0.6"

  down:
    desc: Ferma lo stack di sviluppo locale (docker compose)
    cmds:
      - echo "not implemented yet — see T0.6"

  build:
    desc: Compila ogni modulo Go/Rust/Python popolato in services/
    cmds:
      - bash scripts/task-build.sh

  lint:
    desc: go vet / cargo clippy / ruff check su ogni modulo popolato in services/
    cmds:
      - bash scripts/task-lint.sh

  test:
    desc: go test / cargo test / pytest su ogni modulo, più i test di scripts/guard.sh
    cmds:
      - bash scripts/task-test.sh

  test:integration:
    desc: Test di integrazione con testcontainers (richiede docker)
    cmds:
      - echo "not implemented yet — see T0.7"

  proto:gen:
    desc: Codegen Go (buf generate) + Python (grpc_tools.protoc) da retrieval.proto
    cmds:
      - bash scripts/task-proto-gen.sh

  proto:lint:
    desc: buf lint sui contratti proto (retrieval.proto)
    dir: contracts
    cmds:
      - buf lint

  proto:breaking:
    desc: Buf breaking-change check sui contratti proto contro origin/main
    dir: contracts
    cmds:
      - buf breaking --against '../.git#branch=main,subdir=contracts'

  schema:gen:
    desc: Codegen Pydantic/Go dai JSON Schema via datamodel-code-generator
    cmds:
      - echo "not implemented yet — see T0.3"

  db:migrate:
    desc: Applica le migration Postgres
    cmds:
      - echo "not implemented yet — see T0.5"

  db:migrate:down:
    desc: Rollback delle migration Postgres
    cmds:
      - echo "not implemented yet — see T0.5"

  db:neo4j:migrate:
    desc: Applica le migration Cypher su Neo4j
    cmds:
      - echo "not implemented yet — see T0.4"

  guard:
    desc: Fallisce se contracts/ o docs/add/ sono toccati senza un ADR nello stesso commit
    cmds:
      - bash scripts/guard.sh
