[package]
name = "ingestion"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
sha2 = "0.11.0"
tracing = "0.1.44"
eci-common = { path = "../../libs/rust/eci-common" }
rust_decimal = { version = "1.42.1", features = ["db-postgres"] }
serde_json = "1.0.151"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
postgres = { version = "0.19.14", features = ["with-serde_json-1", "with-uuid-1"] }
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
ureq = { version = "3.3.0", features = ["json"] }
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio"] }
rdkafka = { version = "0.38.0", default-features = false, features = ["tokio", "ssl-vendored", "libz-static"] }
minio = { version = "0.4.0", default-features = false, features = ["default-crypto", "rustls-tls"] }
prometheus = { version = "0.14.0", default-features = false }
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
tracing-opentelemetry = "0.33.0"
fastrand = "2.3.0"

[dev-dependencies]
tracing-core = "=0.1.36"
testcontainers = { version = "0.27.3", features = ["blocking"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
proptest = "1.11.0"
