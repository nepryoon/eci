[package]
name = "ingestion"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
sha2 = "0.11.0"
tracing = "0.1.44"
eci-common = { path = "../../libs/rust/eci-common" }
rust_decimal = { version = "1.42.1", features = ["db-postgres"] }
serde_json = "1.0.151"
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
ureq = { version = "3.3.0", features = ["json"] }
tree-sitter-javascript = "0.25.0"

[dev-dependencies]
testcontainers = { version = "0.27.3", features = ["blocking"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
proptest = "1.11.0"
