[project]
name = "summarization"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.44,<2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["summarization*"]

[tool.ruff]
extend-exclude = [".venv"]
