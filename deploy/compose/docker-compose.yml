# SPEC-006 — stack di sviluppo locale: i cinque datastore (Postgres, Neo4j,
# Qdrant, OpenSearch, MinIO). Kafka/Debezium sono fuori scope (T0.6b, vedi
# SPEC-006 §5) e vengono aggiunti come nuovi servizi in QUESTO stesso file,
# non in un compose separato.
#
# Credenziali: tutte quelle qui sotto (POSTGRES_PASSWORD, NEO4J_AUTH,
# MINIO_ROOT_PASSWORD) sono valori di sviluppo locale, mai da riusare in
# nessun altro ambiente.
#
# OpenSearch qui gira con DISABLE_SECURITY_PLUGIN=true: semplificazione da
# dev per ridurre l'attrito locale. Il Modulo 3 dell'ADD richiede il
# Security plugin attivo in produzione (Document-Level Security) — questa
# disattivazione non va riprodotta in nessun ambiente non-dev.

name: eci-dev

networks:
  eci-dev:
    name: eci-dev

volumes:
  # name: esplicito per ognuno — senza, Compose prefissa i volumi col nome
  # del progetto (di default il nome della directory), diverso dai nomi
  # letterali di SPEC-006 §2.
  eci_postgres_data:
    name: eci_postgres_data
  eci_neo4j_data:
    name: eci_neo4j_data
  eci_neo4j_logs:
    name: eci_neo4j_logs
  eci_qdrant_data:
    name: eci_qdrant_data
  eci_opensearch_data:
    name: eci_opensearch_data
  eci_minio_data:
    name: eci_minio_data
  eci_kafka_data:
    name: eci_kafka_data

services:
  opa:
    # SPEC-056 (T6.2) — PDP ABAC centralizzato. Versione immutabile,
    # pubblicata il 2026-08-28; la policy e' montata read-only e parte in
    # default-deny. HTTP e porta host sono esclusivamente per sviluppo.
    image: openpolicyagent/opa:1.20.1
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-format=json", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      - ./opa/policies/eci_authz.rego:/policies/eci_authz.rego:ro
    networks:
      - eci-dev
    read_only: true
    healthcheck:
      test: ["CMD", "/opa", "eval", "--server", "http://127.0.0.1:8181", "data.eci.authz.decision"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  keycloak:
    # SPEC-055 (T6.1) — IdP OIDC esclusivamente di sviluppo. Versione
    # verificata contro la documentazione/API ufficiale Keycloak corrente;
    # start-dev e direct grant NON sono configurazioni di produzione.
    image: quay.io/keycloak/keycloak:26.7.2
    command: ["start-dev", "--import-realm"]
    env_file:
      - path: .env
        required: true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: eci-admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/eci-realm.json:/opt/keycloak/data/import/eci-realm.json:ro
    networks:
      - eci-dev
    healthcheck:
      # L'immagine ufficiale non contiene curl/wget. Questa richiesta HEAD
      # via /dev/tcp è il probe raccomandato dalla documentazione Keycloak.
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    image: postgres:17
    # wal_level=logical: richiesto da Debezium per il logical decoding
    # (SPEC-007 §2) — senza, il connector fallisce alla registrazione con un
    # errore esplicito, non un timeout criptico. max_wal_senders/
    # max_replication_slots=4 sono ampiamente sufficienti per un solo
    # connector dev (esplicitati per documentare l'intento, il default
    # Postgres è già 10).
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    environment:
      POSTGRES_USER: eci
      POSTGRES_PASSWORD: eci-dev-only
      POSTGRES_DB: eci
    ports:
      - "5432:5432"
    volumes:
      - eci_postgres_data:/var/lib/postgresql/data
    networks:
      - eci-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eci"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    environment:
      # Neo4j Community Edition: vincolante per ADR-0004/ADR-0005
      # (SPEC-004) — mai Enterprise in questo stack.
      NEO4J_AUTH: neo4j/eci-dev-only
      # SPEC-043 §2 (T4.3): Graph Data Science non è incluso di default
      # nell'immagine neo4j:5-community — verificato (non presunto) con un
      # avvio reale dello stack. PageRank/betweenness/Leiden sono tutti
      # tier production (namespace gds. senza prefisso beta/alpha), nessuna
      # licenza Enterprise richiesta.
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - eci_neo4j_data:/data
      - eci_neo4j_logs:/logs
    networks:
      - eci-dev
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  qdrant:
    # :latest verificato al momento dell'implementazione: risolve a v1.18.3,
    # >= 1.11 richiesto dall'ADD per is_tenant — nessun pin esplicito
    # necessario (vedi deviazione in SPEC-006 §10).
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - eci_qdrant_data:/qdrant/storage
    networks:
      - eci-dev
    healthcheck:
      # L'immagine qdrant/qdrant non include curl né wget (solo bash/sh):
      # niente controllo HTTP nativo disponibile qui. Fallback su un
      # controllo TCP via /dev/tcp di bash sulla porta REST — il vero
      # controllo HTTP su /collections è in `task up:verify` (scenario 2),
      # che gira dall'host con curl. Deviazione annotata in SPEC-006 §10.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "9200:9200"
    volumes:
      - eci_opensearch_data:/usr/share/opensearch/data
    networks:
      - eci-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eci
      # >= 8 caratteri richiesti da MinIO: "eci-dev-only-minio" ne ha 19.
      MINIO_ROOT_PASSWORD: eci-dev-only-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - eci_minio_data:/data
    networks:
      - eci-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  kafka:
    # :latest verificato al momento dell'implementazione: risolve a Kafka
    # 4.3.1 (KRaft-only dalla 4.0 — nessuna modalità ZooKeeper da escludere
    # esplicitamente). Nessun pin esplicito necessario (stesso trattamento
    # di Qdrant in SPEC-006, vedi deviazione in SPEC-007 §10).
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9094:9094"
    volumes:
      - eci_kafka_data:/var/lib/kafka/data
    networks:
      - eci-dev
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka-connect:
    # SPEC-007 §2 chiede debezium/connect:latest, ma quel repository/tag
    # non esiste su Docker Hub (solo tag di versione esplicita, es.
    # 2.7.3.Final, mai "latest" — verificato al momento dell'implementazione,
    # `docker pull debezium/connect:latest` fallisce con "not found").
    # L'immagine ufficiale equivalente con tag :latest è pubblicata su Quay
    # (stessi plugin Debezium preinstallati, incluso il connector
    # PostgreSQL). Deviazione annotata in SPEC-007 §10.
    image: quay.io/debezium/connect:latest
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: eci-connect
      CONFIG_STORAGE_TOPIC: eci_connect_configs
      OFFSET_STORAGE_TOPIC: eci_connect_offsets
      STATUS_STORAGE_TOPIC: eci_connect_status
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - postgres
    networks:
      - eci-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    # SPEC-022 §2 — storage del Semantic Cache Service (T2.3). Nessuna
    # persistenza AOF/RDB (--save "" --appendonly no): e' un cache, non una
    # fonte di verita' — il dato e' sempre ricostruibile ricomputando
    # embedding/summary a monte (SPEC-022 §5 Non-goals). Nessun volume
    # nominato per lo stesso motivo: un riavvio del container azzera
    # legittimamente la cache.
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - eci-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  prometheus:
    # SPEC-036 §2 + SPEC-056 §8 — scrape delle metriche di salute dei
    # quattro sink Kafka e delle decisioni/latency authz dei due servizi
    # query. I quattro
    # sink NON sono servizi Docker Compose (verificato, non presunto —
    # vedi nota in deploy/compose/prometheus.yml): girano come processi
    # host, raggiunti da questo container via host.docker.internal, che
    # richiede esplicitamente extra_hosts su Linux (Docker Desktop lo
    # risolve nativamente anche senza, ma l'entry è innocua e necessaria
    # per portabilità verso un Docker Engine nativo non-Desktop).
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - eci-dev
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  tei-embedding:
    # SPEC-023 §2 — Text Embeddings Inference, variante GPU ufficiale, per
    # il vero jina-code-embeddings-1.5b (1536 dim di default) quando una
    # GPU e' disponibile. `profiles: ["gpu"]`: NON avviato da `task up`/
    # `docker compose up` di default (nessuna GPU garantita sulla macchina
    # di sviluppo) — richiede esplicitamente
    # `docker compose --profile gpu up tei-embedding`. Non verificato con
    # un avvio reale in questa SPEC (§5 Non-goals): solo validazione
    # sintattica (`docker compose config`), nessuna GPU disponibile al
    # momento dell'implementazione (verificato: ne' `nvidia-smi` ne'
    # `/dev/nvidia*` presenti in questa sessione).
    image: ghcr.io/huggingface/text-embeddings-inference:latest-cuda
    profiles: ["gpu"]
    environment:
      HF_MODEL_ID: jinaai/jina-code-embeddings-1.5b
    ports:
      - "8002:80"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    networks:
      - eci-dev
