neo4j:
  name: eci-neo4j
  edition: community
  passwordFromSecret: eci-runtime
  resources:
    cpu: "500m"
    memory: 2Gi
securityContext:
  runAsNonRoot: true
  runAsUser: 7474
  runAsGroup: 7474
  fsGroup: 7474
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 7474
  runAsGroup: 7474
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
volumes:
  data:
    mode: defaultStorageClass
    defaultStorageClass:
      requests:
        storage: 1Gi
config:
  server.default_listen_address: 0.0.0.0
env:
  NEO4J_PLUGINS: '["graph-data-science"]'
services:
  neo4j:
    spec: {type: ClusterIP}
