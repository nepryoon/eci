neo4j:
  name: eci-neo4j
  edition: enterprise
  acceptLicenseAgreement: "no"
  minimumClusterSize: 3
  passwordFromSecret: eci-runtime
  resources:
    cpu: "16"
    memory: 256Gi
  operations:
    enableServer: true
    image: neo4j/helm-charts-operations@sha256:3b73609fa084906d2f36ca043d78609718c3ce5bdd3e7613db8a92a96b690687
  additionalJvmArguments:
    - -XX:+ExitOnOutOfMemoryError
securityContext:
  runAsNonRoot: true
  runAsUser: 7474
  runAsGroup: 7474
  fsGroup: 7474
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 7474
  runAsGroup: 7474
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
volumes:
  data:
    mode: defaultStorageClass
    defaultStorageClass:
      requests:
        storage: 100Gi
config:
  server.default_listen_address: 0.0.0.0
  server.cluster.system_database_mode: SECONDARY
  initial.server.mode_constraint: SECONDARY
  server.metrics.prometheus.enabled: "true"
  server.metrics.prometheus.endpoint: "0.0.0.0:2004"
  dbms.security.procedures.unrestricted: gds.*
  dbms.security.procedures.allowlist: gds.*
env:
  # The custom image rewrites this plugin's local source to a root-owned
  # /opt/eci JAR, so the stock entrypoint applies defaults without egress.
  NEO4J_PLUGINS: '["graph-data-science"]'
services:
  neo4j:
    spec: {type: ClusterIP}
    cleanup:
      image:
        registry: registry.k8s.io
        repository: kubectl
        tag: v1.34.0
        digest: sha256:497d298f891edb7608dfce9dae4bb08dffc4ddcd7f5d24a0512d4bbf33e04f26
        imagePullPolicy: IfNotPresent
