replicaCount: 1
image:
  repository: docker.io/qdrant/qdrant
  tag: v1.19.0
  useUnprivilegedImage: true
chartTests:
  dbInteraction:
    image: registry.suse.com/bci/bci-base@sha256:b03880998771ffd522e8808bc01a31098378f82e7c4552273e336de3742109f0
config:
  cluster:
    enabled: false
persistence:
  size: 1Gi
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: "1", memory: 1Gi}
podDisruptionBudget: {enabled: false}
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 2000
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
podSecurityContext:
  fsGroup: 3000
  seccompProfile: {type: RuntimeDefault}
