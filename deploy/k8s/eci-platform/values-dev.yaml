global:
  profile: dev
  highAvailability: false
  neo4jEdition: community

namespaces:
  create: false

applications:
  # No ECI application images are published yet. Infrastructure-only smoke
  # remains honest and never substitutes placeholders.
  enabled: false

routing:
  # The dev installer intentionally uses one community release named neo4j;
  # there is no distinct GDS secondary in this profile.
  neo4jURI: bolt://neo4j.data-plane.svc.cluster.local:7687
  neo4jGDSURI: bolt://neo4j.data-plane.svc.cluster.local:7687

cdc:
  replicas: 1
  heapOptions: "-Xms256M -Xmx768M"
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

resources:
  io:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 500m, memory: 256Mi}
  cpu:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 512Mi}
  java:
    requests: {cpu: 100m, memory: 768Mi}
    limits: {cpu: "1", memory: 1536Mi}

dataPlane:
  redis: {storage: 1Gi}
  postgres: {instances: 1, storage: 1Gi}
  kafka: {replicas: 1, storage: 1Gi, topicPartitions: 1}
  openSearch:
    replicas: 1
    storage: 2Gi
    resources:
      requests: {cpu: 100m, memory: 1Gi}
      limits: {cpu: "1", memory: 2Gi}
  minio: {replicas: 1, storage: 1Gi}
  qdrant: {shardNumber: 1, replicationFactor: 1}
