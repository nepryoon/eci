global:
  imageRegistry: ghcr.io/nepryoon/eci
  # Application images are intentionally unset: an installation may enable
  # applications only with registry-issued OCI digests from its release job.
  imageReferences:
    api-gateway: ""
    orchestrator: ""
    retrieval-engine: ""
    verification: ""
    llm-gateway: ""
    summarization: ""
    semantic-cache: ""
    ingestion: ""
    embedding-worker: ""
    sink-graph: ""
    sink-vector: ""
    sink-search: ""
    gds-impact: ""
  existingSecret: eci-runtime
  storageClass: ""
  profile: production-like
  highAvailability: true
  neo4jEdition: enterprise

namespaces:
  create: true

applications:
  enabled: false
  workloads:
    - name: api-gateway
      namespace: ingress
      port: 8081
      metricsPort: 9107
      replicas: 2
      profile: io
      runtimeSecret: eci-runtime-api-gateway
      secretEnv:
        - {name: ECI_OIDC_ISSUER, key: ECI_OIDC_ISSUER}
        - {name: ECI_OIDC_AUDIENCE, key: ECI_OIDC_AUDIENCE}
    - {name: orchestrator, namespace: query-plane, port: 8080, metricsPort: 9090, replicas: 3, profile: io}
    - name: retrieval-engine
      namespace: query-plane
      port: 50053
      metricsPort: 9105
      replicas: 4
      profile: io
      runtimeSecret: eci-runtime-retrieval-engine
      secretEnv:
        - {name: NEO4J_USER, key: NEO4J_USER}
        - {name: NEO4J_PASSWORD, key: NEO4J_PASSWORD}
        - {name: OPENSEARCH_USERNAME, key: OPENSEARCH_USERNAME}
        - {name: OPENSEARCH_PASSWORD, key: OPENSEARCH_PASSWORD}
    - {name: verification, namespace: query-plane, port: 8080, metricsPort: 9090, replicas: 2, profile: io}
    - {name: llm-gateway, namespace: query-plane, port: 8002, metricsPort: 9090, replicas: 2, profile: io}
    - {name: summarization, namespace: query-plane, port: 8080, metricsPort: 9090, replicas: 2, profile: io}
    - name: semantic-cache
      namespace: query-plane
      port: 50054
      metricsPort: 9106
      replicas: 2
      profile: io
      runtimeSecret: eci-runtime-semantic-cache
      secretEnv: [{name: REDIS_PASSWORD, key: REDIS_PASSWORD}]
    - name: ingestion
      namespace: ingestion-plane
      port: 9100
      metricsPort: 9100
      replicas: 4
      profile: cpu
      runtimeSecret: eci-runtime-ingestion
      secretEnv: [{name: POSTGRES_DSN, key: POSTGRES_DSN}]
    - name: embedding-worker
      namespace: ingestion-plane
      port: 9102
      metricsPort: 9102
      replicas: 2
      profile: io
      runtimeSecret: eci-runtime-embedding-worker
      secretEnv: [{name: POSTGRES_DSN, key: POSTGRES_DSN}]
    - name: sink-graph
      namespace: ingestion-plane
      port: 9101
      metricsPort: 9101
      replicas: 2
      profile: io
      runtimeSecret: eci-runtime-sink-graph
      secretEnv:
        - {name: POSTGRES_DSN, key: POSTGRES_DSN}
        - {name: NEO4J_USER, key: NEO4J_USER}
        - {name: NEO4J_PASSWORD, key: NEO4J_PASSWORD}
    - name: sink-vector
      namespace: ingestion-plane
      port: 9103
      metricsPort: 9103
      replicas: 2
      profile: io
      runtimeSecret: eci-runtime-sink-vector
      secretEnv: [{name: POSTGRES_DSN, key: POSTGRES_DSN}]
    - name: sink-search
      namespace: ingestion-plane
      port: 9104
      metricsPort: 9104
      replicas: 2
      profile: io
      runtimeSecret: eci-runtime-sink-search
      secretEnv:
        - {name: POSTGRES_DSN, key: POSTGRES_DSN}
        - {name: OPENSEARCH_USERNAME, key: OPENSEARCH_USERNAME}
        - {name: OPENSEARCH_PASSWORD, key: OPENSEARCH_PASSWORD}
    - {name: vllm, namespace: gpu-plane, image: "vllm/vllm-openai@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14", port: 8000, metricsPort: 8000, replicas: 1, profile: gpu-vllm}
    - {name: embedder, namespace: gpu-plane, image: "ghcr.io/huggingface/text-embeddings-inference@sha256:274104f179b88e2fdfc20e4d1e5273098f1cbcc2385fdef1687558413af85639", port: 80, metricsPort: 80, replicas: 1, profile: gpu-small}
    - {name: reranker, namespace: gpu-plane, image: "ghcr.io/huggingface/text-embeddings-inference@sha256:274104f179b88e2fdfc20e4d1e5273098f1cbcc2385fdef1687558413af85639", port: 80, metricsPort: 80, replicas: 1, profile: gpu-small}

edge:
  enabled: true
  image: "envoyproxy/envoy@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66"
  configMap: eci-envoy-config
  tlsSecret: eci-envoy-tls
  replicas: 2
  port: 8080
  metricsPort: 9901

routing:
  opaURL: http://opa.query-plane.svc.cluster.local:8181
  retrievalAddress: retrieval-engine.query-plane.svc.cluster.local:50053
  neo4jURI: bolt://neo4j.data-plane.svc.cluster.local:7687
  qdrantHost: qdrant.data-plane.svc.cluster.local
  qdrantGRPCPort: "6334"
  embeddingServiceURL: http://embedder.gpu-plane.svc.cluster.local:80
  rerankerServiceURL: http://reranker.gpu-plane.svc.cluster.local:80
  openSearchURL: https://eci-opensearch.data-plane.svc.cluster.local:9200
  redisAddress: redis.data-plane.svc.cluster.local:6379
  kafkaBrokers: eci-kafka-kafka-bootstrap.data-plane.svc.cluster.local:9092
  kafkaTLSSecret: eci-kafka-client-ca
  openSearchTLSSecret: eci-opensearch-client-ca
  vllmURL: http://vllm.gpu-plane.svc.cluster.local:8000/v1

resources:
  io:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 8Gi}
  cpu:
    requests: {cpu: "4", memory: 8Gi}
    limits: {cpu: "8", memory: 12Gi}
  gpu-vllm:
    requests: {cpu: "16", memory: 96Gi, nvidia.com/gpu: "1"}
    limits: {cpu: "24", memory: 120Gi, nvidia.com/gpu: "1"}
  gpu-small:
    requests: {cpu: "4", memory: 16Gi, nvidia.com/mig-1g.10gb: "1"}
    limits: {cpu: "8", memory: 24Gi, nvidia.com/mig-1g.10gb: "1"}
  java:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

batch:
  gds:
    schedule: "0 2 * * *"
    profile: io
    runtimeSecret: eci-runtime-gds-impact
    secretEnv:
      - {name: NEO4J_USER, key: NEO4J_USER}
      - {name: NEO4J_PASSWORD, key: NEO4J_PASSWORD}

cdc:
  enabled: true
  image: quay.io/debezium/connect@sha256:698f0559e667a242f962221079e75917b2b7a3ad4de62661e977628da0e33b45
  replicas: 2
  heapOptions: "-Xms256M -Xmx1536M"
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

dataPlane:
  enabled: true
  postgres:
    instances: 3
    image: ghcr.io/cloudnative-pg/postgresql:17.6@sha256:30b304a2e300ed80b6d1b740e4369e9b0f25599fb518de78c01fd9f25531791b
    storage: 100Gi
  kafka:
    replicas: 3
    version: "4.3.1"
    storage: 500Gi
  openSearch:
    replicas: 3
    version: "3.2.0"
    storage: 30Gi
    adminCredentialsSecret: eci-opensearch-admin
    securityConfigSecret: eci-opensearch-security-config
    resources:
      requests: {cpu: "2", memory: 4Gi}
      limits: {cpu: "8", memory: 32Gi}
  minio:
    image: minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    replicas: 4
    storage: 100Gi
  qdrant:
    shardNumber: 3
    replicationFactor: 2
