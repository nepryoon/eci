{{- if .Values.dataPlane.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  # One stable DNS endpoint backed by one stateful cache. T7.1 deliberately
  # does not pretend that independent Redis servers form a replicated system.
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: redis-stateful
    app.kubernetes.io/part-of: eci
  ports:
    - {name: service, port: 6379, targetPort: service}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: redis-stateful
      app.kubernetes.io/part-of: eci
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: redis-stateful
        app.kubernetes.io/part-of: eci
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        {{- include "eci.podSecurityContext" . | nindent 8 }}
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/component: redis-stateful
              app.kubernetes.io/part-of: eci
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/component: redis-stateful
              app.kubernetes.io/part-of: eci
      containers:
        - name: redis
          image: "redis@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232"
          imagePullPolicy: IfNotPresent
          args: [redis-server, --requirepass, $(REDIS_PASSWORD), --appendonly, "yes", --appendfsync, everysec, --dir, /data]
          securityContext:
            {{- include "eci.containerSecurityContext" . | nindent 12 }}
          ports:
            - {name: service, containerPort: 6379}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.existingSecret }}, key: redis-password}
          startupProbe:
            tcpSocket: {port: service}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: service}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket: {port: service}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.io | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "eci.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ required "dataPlane.redis.storage is required" .Values.dataPlane.redis.storage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: redis-stateful
      app.kubernetes.io/part-of: eci
{{- end }}
