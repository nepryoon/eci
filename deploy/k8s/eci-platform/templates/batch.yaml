{{- if .Values.applications.enabled }}
{{- $ingestion := .Values.batch.ingestion }}
{{- if ne (default "" $ingestion.runtimeSecret) "eci-runtime-ingestion" }}
{{- fail "batch.ingestion.runtimeSecret must be eci-runtime-ingestion for per-workload isolation" }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingestion
  namespace: ingestion-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion-template
  namespace: ingestion-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  # The current ingestion binary is a one-shot, scoped CLI. Keep this template
  # permanently suspended and clone it explicitly for each prepared snapshot;
  # it must never be misrepresented as a listening Deployment.
  schedule: {{ $ingestion.schedule | quote }}
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ingestion
            app.kubernetes.io/component: ingestion
            app.kubernetes.io/part-of: eci
        spec:
          restartPolicy: Never
          serviceAccountName: ingestion
          automountServiceAccountToken: false
          securityContext:
            {{- include "eci.podSecurityContext" . | nindent 12 }}
          containers:
            - name: ingestion
              image: {{ include "eci.digestImage" (dict "field" "global.imageReferences.ingestion" "value" (index .Values.global.imageReferences "ingestion")) | quote }}
              args: [{{ required "batch.ingestion.sourcePath is required" $ingestion.sourcePath | quote }}]
              securityContext:
                {{- include "eci.containerSecurityContext" . | nindent 16 }}
              env:
                {{- range $secret := $ingestion.secretEnv }}
                - name: {{ $secret.name }}
                  valueFrom:
                    secretKeyRef:
                      name: eci-runtime-ingestion
                      key: {{ $secret.key }}
                {{- end }}
              resources:
                {{- toYaml (index .Values.resources $ingestion.profile) | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: source, mountPath: /input, readOnly: true}
          volumes:
            - name: tmp
              emptyDir: {}
            - name: source
              persistentVolumeClaim:
                claimName: {{ required "batch.ingestion.sourcePVC is required" $ingestion.sourcePVC }}
                readOnly: true
---
{{- range $name, $job := dict "gds-impact" .Values.batch.gds }}
{{- if ne (default "" $job.runtimeSecret) (printf "eci-runtime-%s" $name) }}
{{- fail (printf "batch.%s.runtimeSecret must be eci-runtime-%s for per-workload isolation" $name $name) }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: ingestion-plane
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  # gds-impact requires a concrete entry node and complete ACL scope. Keep the
  # installed object inert and clone it only after preparing its scoped Secret.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $name }}
            app.kubernetes.io/component: {{ $name }}
            app.kubernetes.io/part-of: eci
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $name }}
          automountServiceAccountToken: false
          securityContext:
            {{- include "eci.podSecurityContext" $ | nindent 12 }}
          containers:
            - name: {{ $name }}
              image: {{ include "eci.digestImage" (dict "field" "global.imageReferences.gds-impact" "value" (index $.Values.global.imageReferences "gds-impact")) | quote }}
              args:
                - --entry-node-id=$(ECI_GDS_ENTRY_NODE_ID)
                - --tenant-id=$(ECI_GDS_TENANT_ID)
                - --repo=$(ECI_GDS_REPOSITORY)
                - --acl-group=$(ECI_GDS_ACL_GROUP)
              securityContext:
                {{- include "eci.containerSecurityContext" $ | nindent 16 }}
              envFrom:
                - configMapRef: {name: eci-runtime-routing}
              env:
                - name: NEO4J_URI
                  value: {{ $.Values.routing.neo4jGDSURI | quote }}
                {{- range $secret := $job.secretEnv }}
                - name: {{ $secret.name }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "batch.gds.runtimeSecret is required" $job.runtimeSecret }}
                      key: {{ $secret.key }}
                {{- end }}
              readinessProbe:
                exec: {command: ["/bin/sh", "-c", "test -r /proc/self/status"]}
              livenessProbe:
                exec: {command: ["/bin/sh", "-c", "test -r /proc/self/status"]}
              resources:
                {{- toYaml (index $.Values.resources $job.profile) | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: ingestion-plane
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
