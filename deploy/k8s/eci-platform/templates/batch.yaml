{{- if .Values.applications.enabled }}
{{- range $name, $job := dict "gds-impact" .Values.batch.gds }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  namespace: ingestion-plane
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $name }}
            app.kubernetes.io/component: {{ $name }}
            app.kubernetes.io/part-of: eci
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $name }}
          automountServiceAccountToken: false
          securityContext:
            {{- include "eci.podSecurityContext" $ | nindent 12 }}
          containers:
            - name: {{ $name }}
              image: {{ required "global.imageReferences.gds-impact must be a registry-issued name@sha256 digest when GDS is enabled" (index $.Values.global.imageReferences "gds-impact") | quote }}
              securityContext:
                {{- include "eci.containerSecurityContext" $ | nindent 16 }}
              envFrom:
                - secretRef: {name: {{ $.Values.global.existingSecret }}}
              readinessProbe:
                exec: {command: ["/bin/sh", "-c", "test -r /proc/self/status"]}
              livenessProbe:
                exec: {command: ["/bin/sh", "-c", "test -r /proc/self/status"]}
              resources:
                {{- toYaml (index $.Values.resources $job.profile) | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: ingestion-plane
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
