  (dict "name" "embedding-worker-to-embedder" "sourceNamespace" "ingestion-plane" "source" "embedding-worker" "destinationNamespace" "gpu-plane" "destinationSelector" (dict "app.kubernetes.io/name" "embedder") "port" 80)
  (dict "name" "sink-graph-to-postgres" "sourceNamespace" "ingestion-plane" "source" "sink-graph" "destinationNamespace" "data-plane" "destinationSelector" (dict "cnpg.io/cluster" "eci-postgres") "port" 5432)
  (dict "name" "sink-graph-to-kafka" "sourceNamespace" "ingestion-plane" "source" "sink-graph" "destinationNamespace" "data-plane" "destinationSelector" (dict "strimzi.io/cluster" "eci-kafka" "strimzi.io/component-type" "kafka") "port" 9093)
  (dict "name" "sink-graph-to-neo4j" "sourceNamespace" "ingestion-plane" "source" "sink-graph" "destinationNamespace" "data-plane" "destinationSelector" (dict "app" "eci-neo4j") "port" 7687)
