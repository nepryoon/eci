{{- range $namespace := list "ingress" "query-plane" "gpu-plane" "ingestion-plane" "data-plane" "observability" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $namespace }}
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $namespace }}
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-api-cloudnative-pg-webhook
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes: [Ingress]
  # The apiserver commonly originates outside the pod CIDR and native
  # NetworkPolicy cannot select it by identity. Restrict the portable exception
  # to the CNPG webhook pods and their TLS target port; the webhook itself
  # validates admission traffic. Operators may narrow this CIDR per cluster.
  ingress:
    - from:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 9443}
---
{{- $dataPlanePeers := list
  (dict "name" "postgres-peer" "selector" (dict "cnpg.io/cluster" "eci-postgres") "ports" (list 5432))
  (dict "name" "kafka-peer" "selector" (dict "strimzi.io/cluster" "eci-kafka" "strimzi.io/component-type" "kafka") "ports" (list 9090 9091))
  (dict "name" "opensearch-peer" "selector" (dict "opster.io/opensearch-cluster" "eci-opensearch") "ports" (list 9300))
  (dict "name" "minio-peer" "selector" (dict "app.kubernetes.io/name" "minio" "app.kubernetes.io/component" "minio") "ports" (list 9000))
  (dict "name" "neo4j-peer" "selector" (dict "app" "eci-neo4j") "ports" (list 5000 6000 7000 7688))
}}
{{- range $peer := $dataPlanePeers }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $peer.name }}
  namespace: data-plane
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $peer.selector | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $peer.selector | nindent 14 }}
      ports:
        {{- range $port := $peer.ports }}
        - {protocol: TCP, port: {{ $port }}}
        {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $peer.selector | nindent 14 }}
      ports:
        {{- range $port := $peer.ports }}
        - {protocol: TCP, port: {{ $port }}}
        {{- end }}
---
{{- end }}
{{- $dataPlaneClients := list
  (dict "name" "strimzi-operator-to-kafka" "source" (dict "name" "strimzi-cluster-operator") "destination" (dict "strimzi.io/cluster" "eci-kafka" "strimzi.io/component-type" "kafka") "ports" (list 8443 9091))
  (dict "name" "strimzi-entity-to-kafka" "source" (dict "app.kubernetes.io/name" "entity-operator") "destination" (dict "strimzi.io/cluster" "eci-kafka" "strimzi.io/component-type" "kafka") "ports" (list 9091))
  (dict "name" "cnpg-operator-to-postgres" "source" (dict "app.kubernetes.io/name" "cloudnative-pg") "destination" (dict "cnpg.io/cluster" "eci-postgres") "ports" (list 8000))
  (dict "name" "opensearch-operator-to-cluster" "source" (dict "control-plane" "controller-manager") "destination" (dict "opster.io/opensearch-cluster" "eci-opensearch") "ports" (list 9200))
  (dict "name" "opensearch-security-job-to-cluster" "source" (dict "batch.kubernetes.io/job-name" "eci-opensearch-securityconfig-update" "job-name" "eci-opensearch-securityconfig-update") "destination" (dict "opster.io/opensearch-cluster" "eci-opensearch") "ports" (list 9200))
}}
{{- range $flow := $dataPlaneClients }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $flow.name }}
  namespace: data-plane
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $flow.source | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $flow.destination | nindent 14 }}
      ports:
        {{- range $port := $flow.ports }}
        - {protocol: TCP, port: {{ $port }}}
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $flow.name }}-ingress
  namespace: data-plane
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $flow.destination | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $flow.source | nindent 14 }}
      ports:
        {{- range $port := $flow.ports }}
        - {protocol: TCP, port: {{ $port }}}
        {{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qdrant-peer
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: qdrant}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: qdrant}
      ports: [{protocol: TCP, port: 6335}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: qdrant}
      ports: [{protocol: TCP, port: 6335}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qdrant-bootstrap
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: qdrant-collection-bootstrap}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: qdrant}
      ports: [{protocol: TCP, port: 6333}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qdrant-bootstrap-ingress
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: qdrant}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: qdrant-collection-bootstrap}
      ports: [{protocol: TCP, port: 6333}]
{{- if and .Values.dataPlane.enabled .Values.cdc.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-connect-to-kafka
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kafka-connect}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: eci-kafka
              strimzi.io/component-type: kafka
      ports: [{protocol: TCP, port: 9093}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-connect-to-kafka-ingress
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: eci-kafka
      strimzi.io/component-type: kafka
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: kafka-connect}
      ports: [{protocol: TCP, port: 9093}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-connect-to-postgres
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kafka-connect}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {cnpg.io/cluster: eci-postgres}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-connect-to-postgres-ingress
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {cnpg.io/cluster: eci-postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: kafka-connect}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
{{- $apiClients := list
  (dict "name" "strimzi" "selector" (dict "name" "strimzi-cluster-operator"))
  (dict "name" "strimzi-entity" "selector" (dict "app.kubernetes.io/name" "entity-operator"))
  (dict "name" "cloudnative-pg" "selector" (dict "app.kubernetes.io/name" "cloudnative-pg"))
  (dict "name" "cnpg-instance" "selector" (dict "app.kubernetes.io/managed-by" "cloudnative-pg"))
  (dict "name" "opensearch" "selector" (dict "control-plane" "controller-manager"))
}}
{{- range $client := $apiClients }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-api-{{ $client.name }}
  namespace: data-plane
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $client.selector | nindent 6 }}
  policyTypes: [Egress]
  # Native NetworkPolicy cannot select the kubernetes Service by name and
  # service DNAT ordering differs between CNIs. Limit this portable exception
  # to known control-plane clients and the two API ports.
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
{{- end }}
{{- if eq .Values.global.profile "dev" }}
{{- $devDataPlaneTargets := list
  (dict "name" "postgres" "selector" (dict "cnpg.io/cluster" "eci-postgres") "ports" (list 5432))
  (dict "name" "kafka" "selector" (dict "strimzi.io/cluster" "eci-kafka" "strimzi.io/component-type" "kafka") "ports" (list 9093))
  (dict "name" "neo4j" "selector" (dict "app" "eci-neo4j") "ports" (list 7687))
  (dict "name" "qdrant" "selector" (dict "app.kubernetes.io/name" "qdrant") "ports" (list 6333 6334))
  (dict "name" "opensearch" "selector" (dict "opster.io/opensearch-cluster" "eci-opensearch") "ports" (list 9200))
  (dict "name" "redis" "selector" (dict "app.kubernetes.io/name" "redis") "ports" (list 6379))
  (dict "name" "minio" "selector" (dict "app.kubernetes.io/name" "minio" "app.kubernetes.io/component" "minio") "ports" (list 9000))
}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-connectivity-egress
  namespace: data-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: eci-connectivity}
  policyTypes: [Egress]
  egress:
    {{- range $target := $devDataPlaneTargets }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $target.selector | nindent 14 }}
      ports:
        {{- range $port := $target.ports }}
        - {protocol: TCP, port: {{ $port }}}
        {{- end }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: query-plane}
          podSelector:
            matchLabels: {app.kubernetes.io/name: opa}
      ports: [{protocol: TCP, port: 8181}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress}
          podSelector:
            matchLabels: {app.kubernetes.io/name: keycloak}
      ports: [{protocol: TCP, port: 8443}]
{{- range $target := $devDataPlaneTargets }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-connectivity-to-{{ $target.name }}
  namespace: data-plane
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $target.selector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: eci-connectivity}
      ports:
        {{- range $port := $target.ports }}
        - {protocol: TCP, port: {{ $port }}}
        {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-connectivity-to-opa
  namespace: query-plane
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: opa}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: data-plane}
          podSelector:
            matchLabels: {app.kubernetes.io/name: eci-connectivity}
      ports: [{protocol: TCP, port: 8181}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dev-connectivity-to-keycloak
  namespace: ingress
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: data-plane}
          podSelector:
            matchLabels: {app.kubernetes.io/name: eci-connectivity}
      ports: [{protocol: TCP, port: 8443}]
{{- end }}
{{- if .Values.applications.enabled }}
{{- if and (ne .Values.global.profile "dev") (not .Values.routing.oidcIssuerEgressCIDRs) }}
{{- fail "routing.oidcIssuerEgressCIDRs must contain explicit trusted issuer/proxy CIDRs when applications.enabled=true outside the bundled dev profile" }}
{{- end }}
{{- if .Values.routing.oidcIssuerEgressCIDRs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-to-oidc-issuer
  namespace: ingress
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: api-gateway}
  policyTypes: [Egress]
  egress:
    {{- range $cidr := .Values.routing.oidcIssuerEgressCIDRs }}
    - to: [{ipBlock: {cidr: {{ $cidr | quote }}}}]
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
{{- end }}
{{- $flows := list
  (dict "name" "envoy-to-api-gateway" "sourceNamespace" "ingress" "source" "envoy" "destinationNamespace" "ingress" "destinationSelector" (dict "app.kubernetes.io/name" "api-gateway") "port" 8081)
  (dict "name" "envoy-to-retrieval" "sourceNamespace" "ingress" "source" "envoy" "destinationNamespace" "query-plane" "destinationSelector" (dict "app.kubernetes.io/name" "retrieval-engine") "port" 50053)
  (dict "name" "api-gateway-to-keycloak" "sourceNamespace" "ingress" "source" "api-gateway" "destinationNamespace" "ingress" "destinationSelector" (dict "app.kubernetes.io/name" "keycloak") "port" 8443)
  (dict "name" "api-gateway-to-retrieval" "sourceNamespace" "ingress" "source" "api-gateway" "destinationNamespace" "query-plane" "destinationSelector" (dict "app.kubernetes.io/name" "retrieval-engine") "port" 50053)
  (dict "name" "llm-gateway-to-vllm" "sourceNamespace" "query-plane" "source" "llm-gateway" "destinationNamespace" "gpu-plane" "destinationSelector" (dict "app.kubernetes.io/name" "vllm") "port" 8000)
  (dict "name" "retrieval-engine-to-embedder" "sourceNamespace" "query-plane" "source" "retrieval-engine" "destinationNamespace" "gpu-plane" "destinationSelector" (dict "app.kubernetes.io/name" "embedder") "port" 80)
  (dict "name" "retrieval-engine-to-reranker" "sourceNamespace" "query-plane" "source" "retrieval-engine" "destinationNamespace" "gpu-plane" "destinationSelector" (dict "app.kubernetes.io/name" "reranker") "port" 80)
  (dict "name" "retrieval-engine-to-neo4j" "sourceNamespace" "query-plane" "source" "retrieval-engine" "destinationNamespace" "data-plane" "destinationSelector" (dict "app" "eci-neo4j") "port" 7687)
  (dict "name" "retrieval-engine-to-qdrant" "sourceNamespace" "query-plane" "source" "retrieval-engine" "destinationNamespace" "data-plane" "destinationSelector" (dict "app.kubernetes.io/name" "qdrant") "port" 6334)
  (dict "name" "retrieval-engine-to-opensearch" "sourceNamespace" "query-plane" "source" "retrieval-engine" "destinationNamespace" "data-plane" "destinationSelector" (dict "opster.io/opensearch-cluster" "eci-opensearch") "port" 9200)
  (dict "name" "retrieval-engine-to-opa" "sourceNamespace" "query-plane" "source" "retrieval-engine" "destinationNamespace" "query-plane" "destinationSelector" (dict "app.kubernetes.io/name" "opa") "port" 8181)
  (dict "name" "llm-gateway-to-opa" "sourceNamespace" "query-plane" "source" "llm-gateway" "destinationNamespace" "query-plane" "destinationSelector" (dict "app.kubernetes.io/name" "opa") "port" 8181)
  (dict "name" "semantic-cache-to-opa" "sourceNamespace" "query-plane" "source" "semantic-cache" "destinationNamespace" "query-plane" "destinationSelector" (dict "app.kubernetes.io/name" "opa") "port" 8181)
  (dict "name" "semantic-cache-to-redis" "sourceNamespace" "query-plane" "source" "semantic-cache" "destinationNamespace" "data-plane" "destinationSelector" (dict "app.kubernetes.io/name" "redis") "port" 6379)
  (dict "name" "ingestion-to-postgres" "sourceNamespace" "ingestion-plane" "source" "ingestion" "destinationNamespace" "data-plane" "destinationSelector" (dict "cnpg.io/cluster" "eci-postgres") "port" 5432)
  (dict "name" "ingestion-to-kafka" "sourceNamespace" "ingestion-plane" "source" "ingestion" "destinationNamespace" "data-plane" "destinationSelector" (dict "strimzi.io/cluster" "eci-kafka" "strimzi.io/component-type" "kafka") "port" 9093)
  (dict "name" "ingestion-to-minio" "sourceNamespace" "ingestion-plane" "source" "ingestion" "destinationNamespace" "data-plane" "destinationSelector" (dict "app.kubernetes.io/name" "minio") "port" 9000)
