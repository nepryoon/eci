{{- range $flow := $flows }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $flow.name }}
  namespace: {{ $flow.sourceNamespace }}
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $flow.source }}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $flow.destinationNamespace }}}
          podSelector:
            matchLabels:
              {{- toYaml $flow.destinationSelector | nindent 14 }}
      ports: [{protocol: TCP, port: {{ $flow.port }}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ $flow.name }}-ingress
  namespace: {{ $flow.destinationNamespace }}
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $flow.destinationSelector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $flow.sourceNamespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: {{ $flow.source }}}
      ports: [{protocol: TCP, port: {{ $flow.port }}}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-edge
  namespace: ingress
  labels:
    {{- include "eci.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: envoy}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: {{ .Values.edge.port }}}]
{{- end }}
