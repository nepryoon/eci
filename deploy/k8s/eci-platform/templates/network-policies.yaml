  (dict "name" "api-gateway-to-retrieval" "sourceNamespace" "ingress" "source" "api-gateway" "destinationNamespace" "query-plane" "destinationSelector" (dict "app.kubernetes.io/name" "retrieval-engine") "port" 50053)
  (dict "name" "orchestrator-to-retrieval" "sourceNamespace" "query-plane" "source" "orchestrator" "destinationNamespace" "query-plane" "destinationSelector" (dict "app.kubernetes.io/name" "retrieval-engine") "port" 50053)
