{{- $items := list
  (dict "name" "opa" "namespace" "query-plane" "image" "openpolicyagent/opa:1.20.1" "port" 8181 "args" (list "run" "--server" "--addr=0.0.0.0:8181"))
  (dict "name" "redis" "namespace" "data-plane" "image" "redis:8.2.1-alpine" "port" 6379 "args" (list "redis-server" "--requirepass" "$(REDIS_PASSWORD)"))
  (dict "name" "minio" "namespace" "data-plane" "image" "minio/minio:RELEASE.2025-04-22T22-12-26Z" "port" 9000 "args" (list "server" "/data" "--console-address" ":9001"))
}}
{{- if eq .Values.global.profile "dev" }}
{{- $items = append $items (dict "name" "keycloak" "namespace" "ingress" "image" "quay.io/keycloak/keycloak:26.7.2" "port" 8080 "args" (list "start-dev" "--health-enabled=true")) }}
{{- end }}
{{- range $item := $items }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $item.name }}
  namespace: {{ $item.namespace }}
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $item.name }}
  namespace: {{ $item.namespace }}
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $item.name }}
spec:
  replicas: {{ ternary 2 1 $.Values.global.highAvailability }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "eci.selectorLabels" (dict "name" $item.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eci.selectorLabels" (dict "name" $item.name) | nindent 8 }}
    spec:
      serviceAccountName: {{ $item.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "eci.podSecurityContext" $ | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: {{ $item.name }}, app.kubernetes.io/part-of: eci}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: {{ $item.name }}, app.kubernetes.io/part-of: eci}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: {{ $item.name }}, app.kubernetes.io/part-of: eci}}
      containers:
        - name: {{ $item.name }}
          image: {{ $item.image | quote }}
          args: {{ toJson $item.args }}
          securityContext:
            {{- if eq $item.name "keycloak" }}
            # start-dev performs a Quarkus augmentation; production supplies an
            # optimized immutable IdP image and does not render this dev workload.
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            {{- else }}
            {{- include "eci.containerSecurityContext" $ | nindent 12 }}
            {{- end }}
          ports:
            - {name: service, containerPort: {{ $item.port }}}
          env:
            {{- if eq $item.name "redis" }}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.existingSecret }}, key: redis-password}}
            {{- else if eq $item.name "minio" }}
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.existingSecret }}, key: minio-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.existingSecret }}, key: minio-password}}
            {{- else if eq $item.name "keycloak" }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.existingSecret }}, key: keycloak-user}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.existingSecret }}, key: keycloak-password}}
            {{- end }}
          readinessProbe:
            tcpSocket: {port: service}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          startupProbe:
            tcpSocket: {port: service}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: service}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- if eq $item.name "keycloak" }}
            {{- toYaml $.Values.resources.java | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.resources.io | nindent 12 }}
            {{- end }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if eq $item.name "minio" }}
            - {name: data, mountPath: /data}
            {{- else if eq $item.name "keycloak" }}
            - {name: data, mountPath: /opt/keycloak/data}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if or (eq $item.name "minio") (eq $item.name "keycloak") }}
        - name: data
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $item.name }}
  namespace: {{ $item.namespace }}
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "eci.selectorLabels" (dict "name" $item.name) | nindent 4 }}
  ports:
    - {name: service, port: {{ $item.port }}, targetPort: service}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $item.name }}
  namespace: {{ $item.namespace }}
  labels:
    {{- include "eci.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "eci.selectorLabels" (dict "name" $item.name) | nindent 6 }}
{{- end }}
