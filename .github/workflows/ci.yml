name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: rustup component add clippy
        run: rustup component add clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Install go-task
        run: curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin

      - name: task build
        run: task build

      - name: task lint
        run: task lint

      - name: task test
        run: task test

  # guard + i controlli sui contratti proto (SPEC-002) condividono lo stesso
  # checkout con fetch-depth:0 richiesto da entrambi (BASE_REF/buf breaking
  # devono poter risolvere origin/main): un solo job, non duplicato.
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install go-task
        run: curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin

      - name: task guard
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: task guard

      - name: Install buf + protoc-gen-go + protoc-gen-go-grpc
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: task proto:lint
        run: task proto:lint

      - name: task proto:breaking
        run: task proto:breaking

      - name: Set up .venv-tools (grpc_tools)
        run: |
          python3 -m venv .venv-tools
          .venv-tools/bin/pip install grpcio-tools==1.83.0

      - name: task proto:gen (verifica determinismo)
        run: |
          task proto:gen
          git diff --exit-code -- libs/go libs/py

  datastore-security-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Install golang-migrate
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: T6.3 sink materialization isolation
        run: |
          cargo test --manifest-path services/ingestion/Cargo.toml --test persist_integration_test same_parser_ids_remain_isolated_across_tenants -- --ignored --test-threads=1
          cd services/sink-graph && go test -tags=integration ./internal/consumer -run TestSinkGraphConsumer -v
          cd ../sink-vector && go test -tags=integration ./internal/consumer -run TestSinkVectorConsumer -v
          cd ../sink-search && go test -tags=integration ./internal/consumer -run TestSinkSearchConsumer -v

      - name: T6.3 cross-store retrieval isolation
        run: |
          cd services/retrieval-engine
          go test -tags=integration ./internal/server -run TestRetrievalEngineServer -v
          go test -tags=integration ./internal/hybridsearch -run 'TestHybridSearchIntegration|TestHybridGraphVectorSearchContentHydration' -v

      - name: T6.4 authenticated semantic-cache isolation
        run: |
          cd services/semantic-cache
          go test -tags=integration ./internal/server -run TestSemanticCacheServer -v
