name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: rustup component add clippy
        run: rustup component add clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Install go-task
        run: |
          curl -fsSL https://github.com/go-task/task/releases/download/v3.53.1/task_linux_amd64.tar.gz -o /tmp/task.tar.gz
          echo 'a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7  /tmp/task.tar.gz' | sha256sum -c -
          tar -xzf /tmp/task.tar.gz -C /usr/local/bin task

      - name: task build
        run: task build

      - name: task lint
        run: task lint

      - name: task test
        run: task test

  # guard + i controlli sui contratti proto (SPEC-002) condividono lo stesso
  # checkout con fetch-depth:0 richiesto da entrambi (BASE_REF/buf breaking
  # devono poter risolvere origin/main): un solo job, non duplicato.
  guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install go-task
        run: |
          curl -fsSL https://github.com/go-task/task/releases/download/v3.53.1/task_linux_amd64.tar.gz -o /tmp/task.tar.gz
          echo 'a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7  /tmp/task.tar.gz' | sha256sum -c -
          tar -xzf /tmp/task.tar.gz -C /usr/local/bin task

      - name: task guard
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: task guard

      - name: Install buf + protoc-gen-go + protoc-gen-go-grpc
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: task proto:lint
        run: task proto:lint

      - name: task proto:breaking
        run: task proto:breaking

      - name: Set up .venv-tools (grpc_tools)
        run: |
          python3 -m venv .venv-tools
          .venv-tools/bin/pip install grpcio-tools==1.83.0

      - name: task proto:gen (verifica determinismo)
        run: |
          task proto:gen
          git diff --exit-code -- libs/go libs/py

  datastore-security-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Install golang-migrate
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: T6.3 sink materialization isolation
        run: |
          cargo test --manifest-path services/ingestion/Cargo.toml --test persist_integration_test same_parser_ids_remain_isolated_across_tenants -- --ignored --test-threads=1
          cd services/sink-graph && go test -tags=integration ./internal/consumer -run TestSinkGraphConsumer -v
          cd ../sink-vector && go test -tags=integration ./internal/consumer -run TestSinkVectorConsumer -v
          cd ../sink-search && go test -tags=integration ./internal/consumer -run TestSinkSearchConsumer -v

      - name: T6.3 cross-store retrieval isolation
        run: |
          cd services/retrieval-engine
          go test -tags=integration ./internal/server -run TestRetrievalEngineServer -v
          go test -tags=integration ./internal/hybridsearch -run 'TestHybridSearchIntegration|TestHybridGraphVectorSearchContentHydration' -v

      - name: T6.4 authenticated semantic-cache isolation
        run: |
          cd services/semantic-cache
          go test -tags=integration ./internal/server -run TestSemanticCacheServer -v

      - name: T6.7 GDS per-ACL and stale-score isolation
        run: |
          cd tools/gds-impact
          go test -tags=integration ./internal/gdsimpact/... -run TestGDSImpact -v
          cd ../../services/retrieval-engine
          go test -tags=integration ./internal/rerank -run TestRerankIntegration -v

  worm-audit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: T6.5 MinIO Object Lock COMPLIANCE
        run: bash scripts/test-minio-worm.sh

  envoy-gateway-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Install go-task and buf
        run: |
          curl -fsSL https://github.com/go-task/task/releases/download/v3.53.1/task_linux_amd64.tar.gz -o /tmp/task.tar.gz
          echo 'a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7  /tmp/task.tar.gz' | sha256sum -c -
          tar -xzf /tmp/task.tar.gz -C /usr/local/bin task
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: T6.6 deterministic Envoy descriptor
        run: |
          task envoy:descriptor
          git diff --exit-code -- deploy/envoy/retrieval.pb

      - name: T6.6 pinned Envoy configuration validation
        run: task envoy:validate

      - name: T6.6 JSON/gRPC, SSE, auth and rate-limit integration
        run: task test:envoy

  kubernetes-platform-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Kubernetes validation toolchain
        run: |
          pip install PyYAML==6.0.3
          curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz --strip-components=1 -C /usr/local/bin linux-amd64/helm
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz' | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          curl -fsSL https://github.com/go-task/task/releases/download/v3.53.1/task_linux_amd64.tar.gz -o /tmp/task.tar.gz
          echo 'a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7  /tmp/task.tar.gz' | sha256sum -c -
          tar -xzf /tmp/task.tar.gz -C /usr/local/bin task

      - name: T7.1 deterministic Helm, policy and schema validation
        run: task k8s:validate
